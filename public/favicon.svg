<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lexi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Scales & AI Gradient -->
    <linearGradient id="lexi-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="lexi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with refined border -->
  <rect width="32" height="32" rx="7.5" fill="url(#lexi-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#334155" stroke-width="0.8"/>

  <g filter="url(#lexi-glow)">
    <!-- Base Plate -->
    <line x1="11" y1="26" x2="21" y2="26" stroke="url(#lexi-accent)" stroke-width="1.75" stroke-linecap="round"/>

    <!-- Central Pillar -->
    <line x1="16" y1="6.5" x2="16" y2="26" stroke="url(#lexi-accent)" stroke-width="1.75" stroke-linecap="round"/>

    <!-- Balance Crossbeam -->
    <path d="M7 11.5 C10 10.2, 13 9.5, 16 9.5 C19 9.5, 22 10.2, 25 11.5" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Left Pan -->
    <path d="M4.5 18 C5.2 20.5, 8.8 20.5, 9.5 18 Z" fill="#3B82F6" fill-opacity="0.25" stroke="url(#lexi-accent)" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="7" y1="11.5" x2="4.5" y2="18" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="7" y1="11.5" x2="9.5" y2="18" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Right Pan -->
    <path d="M22.5 18 C23.2 20.5, 26.8 20.5, 27.5 18 Z" fill="#3B82F6" fill-opacity="0.25" stroke="url(#lexi-accent)" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="25" y1="11.5" x2="22.5" y2="18" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="25" y1="11.5" x2="27.5" y2="18" stroke="#94A3B8" stroke-width="0.9" stroke-linecap="round"/>

    <!-- AI Spark / Intelligence Node atop the Scales -->
    <circle cx="16" cy="6.5" r="1.6" fill="#38BDF8"/>
    <circle cx="16" cy="6.5" r="0.8" fill="#FFFFFF"/>
  </g>
</svg>
